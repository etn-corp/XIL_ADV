name: Export manual test cases to Markdown

on:
  push:
    paths:
      - "Manual Test Scripts/**/*.xlsx"
      - "Manual Test Scripts/**/*.xlsm"
      - "tools/xlsx_to_md.py"
      - "tools/requirements.txt"
      - ".github/workflows/xlsx-test-cases-to-md.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xlsx-test-cases-to-md-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Generate Markdown test cases
        run: |
          python tools/xlsx_to_md.py \
            "Manual Test Scripts" \
            --output "Manual Test Scripts Markdown"

      - name: Show generated files
        shell: bash
        run: |
          echo "Generated Markdown files:"
          find "Manual Test Scripts Markdown" \
            -type f \
            -name "*.md" \
            -print \
            | sort

          echo
          echo "Number of generated Markdown files:"
          find "Manual Test Scripts Markdown" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "Git status:"
          git status --short

      - name: Commit generated Markdown
        shell: bash
        run: |
          git add -A -- "Manual Test Scripts Markdown"

          if git diff --cached --quiet; then
            echo "No generated Markdown changes"
            exit 0
          fi

          echo "Generated Markdown changes:"
          git diff --cached --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update generated manual test cases"
          git push